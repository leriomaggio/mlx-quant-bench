[project]
name = "mlx-quant-bench"
version = "0.1.0"
description = "Quantization benchmarks for LLMs on Apple Silicon via MLX"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Valerio Maggio", email = "valerio.maggio@gmail.com"},
]
keywords = ["mlx", "apple-silicon", "llm", "quantization", "benchmarking", "mistral"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "mlx>=0.21.0",
    "mlx-lm>=0.20.0",
    "huggingface_hub>=0.26.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[project.scripts]
mlx-quant-bench = "mlx_quant_bench.cli:main"

[project.urls]
Repository = "https://github.com/leriomaggio/mlx-quant-bench"
Issues = "https://github.com/leriomaggio/mlx-quant-bench/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_quant_bench"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
